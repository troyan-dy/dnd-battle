[flake8]
# wemake-python-styleguide (WPS) — run with `uv run flake8 .` from backend/.
# Ruff already covers pycodestyle/pyflakes (E/W/F), import sorting and formatting,
# and flake8 never ran here before, so flake8 runs ONLY the WPS checks.
select = WPS
# Same as [tool.ruff] line-length in pyproject.toml.
max-line-length = 100
exclude =
    .git,
    .venv,
    __pycache__,
    .mypy_cache,
    .pytest_cache,
    .ruff_cache,
    var,

# Every ignore below is scoped to specific files and justified; there are no
# global ignores. Line-level exceptions use `# noqa: WPSxxx` with a comment.
per-file-ignores =
    # The rules-engine facade: `__all__` is its documented public contract and is
    # pinned by tests/test_rules_module.py (WPS410/WPS412: `__all__` is "logic" in an
    # `__init__`); it re-exports all 52 names of the five rules modules (WPS203,
    # WPS235). Dropping or splitting any of that would change the public API.
    app/rules/__init__.py: WPS203, WPS235, WPS410, WPS412
    # Eight public attack-rules names, all part of `app.rules.__all__`. The package's
    # module list is pinned by tests/test_rules_module.py, so none can move to a new
    # module, and moving them into an unrelated sibling would only hide the count.
    app/rules/attack.py: WPS202
    # Alembic revision scripts are frozen DDL snapshots: they spell out column names,
    # types and lengths literally per table (WPS226 / WPS204 / WPS432). Pulling those
    # into shared constants would make history change whenever the models change.
    alembic/versions/*.py: WPS204, WPS226, WPS432
    # Tests: literal expected values (WPS432) and repeated literals / asserts /
    # arrange steps (WPS226, WPS204), descriptive test names incl. status codes and
    # "2024" (WPS118, WPS114), several asserts and locals per test (WPS218, WPS210)
    # and many tests per module (WPS202). WPS520 is documented as allowed inside
    # `assert` (since WPS 1.0), but the check walks up from the `==` operator node,
    # which CPython shares across the whole module, so the exemption depends on
    # where the file's LAST `==` sits; it only fires on `assert x == []` here.
    tests/*.py: WPS114, WPS118, WPS202, WPS204, WPS210, WPS218, WPS226, WPS432, WPS520
